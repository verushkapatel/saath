    <linearGradient id="lipT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f3640"/><stop offset="1" stop-color="#a6444d"/></linearGradient>
    <linearGradient id="lipB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b04f57"/><stop offset="1" stop-color="#93393f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d27a"/><stop offset="1" stop-color="#b8862f"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
