    <radialGradient id="skin" cx="45%" cy="38%" r="65%"><stop offset="0" stop-color="#e2a982"/><stop offset="0.55" stop-color="#cf8f66"/><stop offset="1" stop-color="#a96a45"/></radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c5f3d"/><stop offset="0.45" stop-color="#c3845c"/><stop offset="1" stop-color="#cf9068"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c1d18"/><stop offset="0.5" stop-color="#150d0b"/><stop offset="1" stop-color="#0c0706"/></linearGradient>
