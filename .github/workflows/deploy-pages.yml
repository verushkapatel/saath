# Builds Saath and publishes it to the main branch, which GitHub Pages serves at /saath.
#
# Saath AI's online model, two ways:
#   - Easiest: add a repository secret CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers").
#     This workflow then deploys server/saath-ai-worker to Cloudflare itself and builds the app with its address.
#     If the token can see more than one Cloudflare account, also add the secret CLOUDFLARE_ACCOUNT_ID.
#   - Or deploy the Worker yourself and set the repository variable SAATH_AI_URL to its address.
# With neither, Saath AI answers on each device from the checked guides.
name: Deploy Saath

on:
  push:
    branches: [companion-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm test

      - name: Deploy the Saath AI server
        id: ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SAATH_AI_URL: ${{ vars.SAATH_AI_URL }}
          SAATH_ADMIN_USERNAME: ${{ secrets.SAATH_ADMIN_USERNAME }}
          SAATH_ADMIN_PASSWORD: ${{ secrets.SAATH_ADMIN_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          url="$SAATH_AI_URL"
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            cd server/saath-ai-worker
            npx --yes wrangler@3 deploy 2>&1 | tee deploy.log
            url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
            if [ -z "$url" ]; then echo "::error::The Worker deployed but no workers.dev address was printed. Open Workers & Pages in the Cloudflare dashboard once to create your workers.dev subdomain, then run this again."; exit 1; fi
            # The owner login for Live Users. Values come only from repository secrets and never reach the app's code.
            if [ -n "$SAATH_ADMIN_USERNAME" ] && [ -n "$SAATH_ADMIN_PASSWORD" ]; then
              printf '%s' "$SAATH_ADMIN_USERNAME" | npx --yes wrangler@3 secret put ADMIN_USERNAME >/dev/null
              printf '%s' "$SAATH_ADMIN_PASSWORD" | npx --yes wrangler@3 secret put ADMIN_PASSWORD >/dev/null
              echo "Owner login for Live Users updated."
            else
              echo "::notice::Add repository secrets SAATH_ADMIN_USERNAME and SAATH_ADMIN_PASSWORD to set the Live Users login."
            fi
            # Optional free model keys. Each one adds another free daily quota before Workers AI is used.
            for key in GROQ_API_KEY GEMINI_API_KEY OPENROUTER_API_KEY; do
              value="${!key}"
              if [ -n "$value" ]; then printf '%s' "$value" | npx --yes wrangler@3 secret put "$key" >/dev/null && echo "$key set."; fi
            done
            cd - >/dev/null
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            # A quick check that the server answers for this site, without failing the publish if the model is slow.
            code=$(curl -s -o answer.json -w "%{http_code}" -X POST "$url" -H "origin: https://verushkapatel.github.io" -H "content-type: application/json" -H "x-saath-check: 1" \
              -d '{"task":"answer","lang":"en","input":"What is an EMI?","passages":[{"title":"EMI","text":"An EMI is the same payment every month until a loan is repaid."}]}' || true)
            echo "Saath AI server: $url answered HTTP $code"; cat answer.json || true; echo
            if [ "$code" != "200" ]; then echo "::warning::The Saath AI server did not answer with 200. The app falls back to on-device answers until it does."; fi
          else
            echo "No Saath AI server configured. Saath AI answers on each device."
          fi

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /saath
          NEXT_PUBLIC_SAATH_AI_URL: ${{ steps.ai.outputs.url }}
          NEXT_PUBLIC_SAATH_SERVICE_URL: ${{ steps.ai.outputs.url }}
        run: npm run build:pages

      - name: Handbook PDFs
        env:
          NEXT_PUBLIC_BASE_PATH: /saath
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run handbook:pdf || echo "Handbook PDFs were not made; the app's Print button still works."

      - name: Publish to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add ../site origin/main
          cd ../site
          git checkout -B main origin/main
          git rm -rq .
          # The GitHub address now forwards every page to getsaath.pages.dev.
          cp "$GITHUB_WORKSPACE/scripts/redirect/index.html" index.html
          cp index.html 404.html
          cp "$GITHUB_WORKSPACE/scripts/redirect/sw.js" sw.js
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Publish Saath from ${GITHUB_SHA::7}"
          git push origin main

      # A short address as well, on Cloudflare Pages (free), built for the site root. pages.dev names are global, so
      # the first candidate Cloudflare gives us exactly (no random suffix) is used, then the page is fetched to confirm
      # it really is Saath.
      - name: Publish to a short pages.dev address
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SAATH_AI_URL: ${{ steps.ai.outputs.url }}
          NEXT_PUBLIC_SAATH_SERVICE_URL: ${{ steps.ai.outputs.url }}
        run: |
          npm run build:pages
          W="npx --yes wrangler@3"
          for old in sath saath-in mysaath saath-app saathapp; do $W pages project delete "$old" --yes >/dev/null 2>&1 || true; done
          chosen=""
          for name in getsaath; do
            out=$($W pages project create "$name" --production-branch main 2>&1 || true)
            echo "$out" | tail -2
            if echo "$out" | grep -q "https://$name.pages.dev"; then chosen="$name"; break; fi
            if echo "$out" | grep -qi "already exists"; then
              $W pages project list 2>/dev/null | grep -q "$name.pages.dev" && { chosen="$name"; break; }
            fi
            $W pages project delete "$name" --yes >/dev/null 2>&1 || true
          done
          [ -n "$chosen" ] || { echo "No exact short name was free."; exit 1; }
          $W pages deploy out --project-name "$chosen" --branch main --commit-dirty=true
          sleep 20
          url="https://$chosen.pages.dev/"
          if curl -sL "$url" | grep -q "skyward-logo\|The Skyward Project"; then echo "VERIFIED: $url serves Saath"; else echo "NOT VERIFIED: $url"; curl -sL "$url" | head -c 400; fi
          # saath.cc: a small Worker on the domain serves this site. Workers custom domains create their own DNS records.
          API=https://api.cloudflare.com/client/v4; H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          acct=$(curl -s -H "$H" "$API/accounts" | jq -r '.result[0].id')
          # Release the earlier Pages attachment so the Worker can take the hostnames.
          for d in saath.cc www.saath.cc; do curl -s -X DELETE -H "$H" "$API/accounts/$acct/pages/projects/$chosen/domains/$d" >/dev/null || true; done
          (cd server/saath-cc && $W deploy 2>&1 | tail -15) || echo "saath.cc Worker deploy failed"
          for i in 1 2 3 4 5 6 7 8 9; do
            if curl -sL --max-time 15 https://saath.cc/ | grep -q "skyward-logo\|The Skyward Project"; then echo "VERIFIED: https://saath.cc/ serves Saath"; break; fi
            echo "saath.cc not serving yet (try $i): HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://saath.cc/)"; sleep 20
          done
          curl -s -H "$H" "$API/accounts/$acct/workers/domains" | jq -c '.result[]? | {hostname, service}'
          # saath.cc must serve this exact build, not an older copy.
          a=$(curl -s https://getsaath.pages.dev/ | md5sum | cut -c1-12); b=$(curl -s -H 'cache-control: no-cache' https://saath.cc/ | md5sum | cut -c1-12)
          echo "home page on pages.dev: $a / on saath.cc: $b"; [ "$a" = "$b" ] && echo "SAME BUILD on saath.cc" || echo "::warning::saath.cc serves a different build"
          # Every main screen and the new features answer on saath.cc.
          for path in "" journey/ guide/ guide/what-insurance/ money-lab/ forms/ resume/ handbook/ ai/ content/guide.json sw.js; do
            echo "saath.cc/$path -> HTTP $(curl -s -o /dev/null -L -w '%{http_code}' --max-time 20 "https://saath.cc/$path")"
          done

      - name: Publish to Firebase (saath.web.app)
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT || 'saath' }}
          FIREBASE_SITE: ${{ vars.FIREBASE_SITE || 'saath' }}
        run: |
          echo "saath.web.app right now: HTTP $(curl -s -o /dev/null -w '%{http_code}' https://saath.web.app/)"
          curl -sL https://saath.web.app/ | head -c 300; echo
          [ -n "$FIREBASE_SA" ] || { echo "No FIREBASE_SERVICE_ACCOUNT secret yet; skipping Firebase."; exit 0; }
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '{"hosting":{"site":"%s","public":"out","trailingSlash":true}}' "$FIREBASE_SITE" > firebase.json
          npx --yes firebase-tools@13 deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive
          sleep 10
          url="https://$FIREBASE_SITE.web.app/"
          if curl -sL "$url" | grep -q "skyward-logo\|The Skyward Project"; then echo "VERIFIED: $url serves Saath"; else echo "NOT VERIFIED: $url"; fi
