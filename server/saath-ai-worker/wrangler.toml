name = "saath-ai"
main = "worker.js"
compatibility_date = "2025-01-01"

# Option 1: Cloudflare Workers AI. Has a free daily allowance and needs no key.
[ai]
binding = "AI"

[vars]
# The app's address. Requests from anywhere else are refused. Separate several with commas.
ALLOWED_ORIGIN = "https://saath.cc,https://www.saath.cc,https://saath.web.app,https://saath.firebaseapp.com,https://getsaath.pages.dev,https://trysaath.pages.dev,https://usesaath.pages.dev,https://saathhq.pages.dev,https://verushkapatel.github.io,https://wealth-story-1.preview.emergentagent.com"
# AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# FEEDBACK_FROM = "saath@your-verified-domain.example"

[[durable_objects.bindings]]
name = "SAATH_STATE"
class_name = "SaathState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SaathState"]

# After verifying the fixed destination address in Cloudflare Email Routing:
# [[send_email]]
# name = "FEEDBACK_EMAIL"
# destination_address = "verushkapatel4@gmail.com"

# Option 2: an OpenAI-compatible API instead. Remove the [ai] block above, then run:
#   npx wrangler secret put AI_API_KEY
#   npx wrangler secret put AI_BASE_URL     (for example https://api.groq.com/openai/v1)
#   npx wrangler secret put AI_MODEL
